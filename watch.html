<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Watch — YouTube Pipeline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #000; color: #eee;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  main { width: 100%; max-width: 1100px; padding: 12px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 10px; line-height: 1.35; }
  video {
    width: 100%; max-height: calc(100dvh - 130px);
    background: #000; border-radius: 10px; display: block;
  }
  .links { margin: 12px 2px 0; font-size: 14px; }
  .links a { color: #8ab4f8; }
  #msg { margin: 10px 2px 0; font-size: 14px; color: #f2b8b5; min-height: 1em; }
</style>
</head>
<body>
<main>
  <h1 id="title" dir="auto"></h1>
  <video id="player" controls playsinline preload="metadata"></video>
  <p id="msg" role="alert"></p>
  <p class="links">
    <a id="dl" href="#" rel="noopener">Open the file directly (download)</a>
    &nbsp;·&nbsp;
    <a href="dashboard.html">← Back to the dashboard</a>
  </p>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var src = q.get("src") || "";
  if (!src && q.get("bin") && q.get("file")) {
    src = "https://filebin.net/" + encodeURIComponent(q.get("bin")) +
          "/" + encodeURIComponent(q.get("file"));
  }
  var title = q.get("title") || "";
  var video = document.getElementById("player");
  var msg = document.getElementById("msg");
  var titleEl = document.getElementById("title");
  var dl = document.getElementById("dl");

  if (title) {
    titleEl.textContent = title;
    document.title = title;
  } else {
    titleEl.style.display = "none";
  }
  if (!src) {
    msg.textContent = "No video was specified in this link.";
    dl.style.display = "none";
    return;
  }
  dl.href = src;
  video.src = src;

  // The review host (filebin) answers the file URL with a redirect
  // to a short-lived signed URL (~15 min). If playback errors out
  // after that signature ages — e.g. a long pause mid-video —
  // re-request the file URL (which mints a fresh signature) and
  // resume at the same position instead of failing.
  var retries = 0;
  video.addEventListener("error", function () {
    if (retries >= 8) {
      msg.textContent = "Playback hit a problem. Use the direct " +
        "file link below, or reopen this page from the dashboard.";
      return;
    }
    retries += 1;
    var t = 0;
    try { t = video.currentTime || 0; } catch (e) { /* not ready */ }
    var sep = src.indexOf("?") >= 0 ? "&" : "?";
    video.src = src + sep + "retry=" + Date.now();
    video.load();
    video.addEventListener("loadedmetadata", function resume() {
      video.removeEventListener("loadedmetadata", resume);
      try { if (t > 0) video.currentTime = t; } catch (e) { /* noop */ }
      var p = video.play();
      if (p && p.catch) p.catch(function () { /* user can tap play */ });
    });
  });
})();
</script>
</body>
</html>
